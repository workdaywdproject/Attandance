<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biometric Attendance Terminal</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <div class="main-content" style="display: flex; align-items: center; justify-content: center;">
        <div class="card id-step" id="step-1" style="width: 100%; max-width: 440px; text-align: center;">
            <h2 style="color: var(--primary); margin-bottom: 8px;">Smart Face Recognition</h2>
            <p class="sub-title">Please position your face within the camera frame</p>
            <hr>
            
            <div style="margin: 24px 0; display: flex; justify-content: center; gap: 20px;">
                <label style="font-weight: 600; font-size: 1.05rem; cursor: pointer;">
                    <input type="radio" name="attendance-type" value="IN" checked style="transform: scale(1.2); margin-right: 6px;"> Check-In
                </label>
                <label style="font-weight: 600; font-size: 1.05rem; cursor: pointer;">
                    <input type="radio" name="attendance-type" value="OUT" style="transform: scale(1.2); margin-right: 6px;"> Check-Out
                </label>
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Remarks (Optional)</label>
                <input type="text" id="remark" placeholder="e.g., Late due to traffic, feeling unwell...">
            </div>

            <button onclick="openScanModal()" class="btn-blue" style="padding: 14px; font-size: 1rem;">📸 Start Face Scan</button>
            <button onclick="window.location.href='portal.html'" class="btn-gray" style="margin-top: 10px; background: #e2e8f0; color:#333;">Go to Admin Portal</button>
        </div>

        <div class="card hidden" id="step-2" style="width: 100%; max-width: 440px; text-align: center;">
            <h3 style="color: var(--success);">Face Verification Success</h3>
            <hr>
            <div style="background: #f8f9fa; padding: 16px; border-radius: 8px; text-align: left; margin-bottom: 20px; border-left: 4px solid var(--success);">
                <p style="margin-bottom: 6px;">🆔 Employee ID: <b id="recognized-id"></b></p>
                <p style="margin-bottom: 6px;">👤 Name: <b id="recognized-name"></b></p>
                <p>💼 Position: <b id="recognized-pos"></b></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="showConfirmModal()" class="btn-green">Confirm & Save</button>
                <button onclick="location.reload()" class="btn-gray">Try Again</button>
            </div>
        </div>
    </div>

    <div id="scan-modal" class="modal-overlay hidden">
        <div class="card" style="width: 340px; text-align: center;">
            <h3 style="color: var(--primary);">Face Scanning</h3>
            
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>
            
            <p id="instruction" class="instruction-box">Initializing camera stream...</p>
            <button onclick="closeScanModal()" class="btn-gray" style="margin-top: 12px;">Cancel</button>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="card" style="width: 360px; text-align: center;">
            <h3>Confirm Attendance Log</h3>
            <hr>
            <div style="text-align: left; font-size: 0.9rem; color: var(--text); line-height: 1.6; margin-bottom: 20px;">
                <p>Employee: <span id="conf-name" style="font-weight: 600;"></span></p>
                <p>Action Type: <span id="conf-type" style="font-weight: 700; color: var(--primary);"></span></p>
                <p>Remarks: <span id="conf-remark"></span></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="submitAttendance()" class="btn-blue">Yes, Confirm</button>
                <button onclick="closeConfirmModal()" class="btn-gray">Cancel</button>
            </div>
        </div>
    </div>

    <div id="status-modal" class="modal-overlay hidden">
        <div class="card" style="width: 340px; text-align: center;">
            <h3 id="status-title">Status Notice</h3>
            <p id="status-message" style="margin: 14px 0; color: var(--text-muted); font-size: 0.9rem;"></p>
            <button onclick="document.getElementById('status-modal').classList.add('hidden')" class="btn-blue">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
