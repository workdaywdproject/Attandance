<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biometric Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <div class="container">
        <h2>📊 ဝန်ထမ်း Attendance စနစ်</h2>
        <p class="sub-title">Biometric Liveness Verification</p>
        <hr>

        <div id="step-1" class="card">
            <h3>အဆင့် ၁ - အချက်အလက် ဖြည့်ပါ</h3>
            <div class="form-group">
                <label>ဝန်ထမ်းကုဒ် (Employee ID):</label>
                <input type="text" id="emp-id" placeholder="ဥပမာ - EMP001">
            </div>
            <div class="form-group">
                <label>ဝန်ထမ်းအမည် (Name):</label>
                <input type="text" id="emp-name" placeholder="ဥပမာ - ဦးမောင်မောင်">
            </div>
            <button onclick="startFaceScan('USER')" class="btn-blue">ရှေ့သို့ ဆက်သွားမည် ➔</button>
        </div>

        <div id="step-2" class="card hidden">
            <h3>အဆင့် ၂ - မျက်နှာသွင်ပြင် စစ်ဆေးခြင်း</h3>
            <p id="instruction" class="instruction-box">ကင်မရာ ဖွင့်နေပါသည်...</p>
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>
        </div>

        <div id="step-3" class="card hidden">
            <h3>အဆင့် ၃ - မှတ်တမ်းတင်ရန် အဆင်သင့်ဖြစ်ပါပြီ</h3>
            <p class="success-text">✓ ဇီဝအချက်အထား စစ်ဆေးမှု အောင်မြင်ပါသည်။</p>
            
            <div class="form-group">
                <label>တက်ရောက်မှု အမျိုးအစား:</label>
                <div class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="attendance-type" value="IN" checked> 
                        <span>အဝင် (Check-In)</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="attendance-type" value="OUT"> 
                        <span>အထွက် (Check-Out)</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>မှတ်ချက် (Remark):</label>
                <input type="text" id="remark" placeholder="မရှိလျှင် အလွတ်ထားနိုင်ပါသည်">
            </div>

            <button onclick="submitAttendance()" class="btn-green">📍 တက်ရောက်မှု မှတ်တမ်းတင်မည်</button>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
            <a href="portal.html" class="nav-link">➔ ပင်မစာမျက်နှာ (Portal Gateway) သို့ ပြန်သွားရန်</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
