<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Face Verify</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>Attendance Face Scan</h2>
        
        <div id="step-1">
            <input type="text" id="emp-id" placeholder="ဝန်ထမ်း ID ရိုက်ထည့်ပါ">
            <input type="text" id="emp-name" placeholder="ဝန်ထမ်း နာမည် ရိုက်ထည့်ပါ">
            <button onclick="startFaceScan('USER')" class="btn-blue">Next (Face Scan ဖတ်မည်)</button>
        </div>

        <div id="step-2" class="hidden">
            <div id="instruction" class="instruction-box">ခဏစောင့်ပါ... AI စနစ်ပြင်ဆင်နေပါသည်</div>
            <div class="camera-wrapper">
                <video id="video" autoplay muted playsinline></video>
                <div class="camera-overlay"></div>
            </div>
        </div>

        <div id="step-3" class="hidden">
            <div class="instruction-box" style="background:#dcfce7; border-color:#22c55e; color:#15803d;">✓ အထောက်အထား စစ်ဆေးမှု အောင်မြင်ပါသည်</div>
            <div style="display:flex; justify-content:center; gap:24px; margin-bottom:16px;">
                <label style="cursor:pointer; font-weight:600;"><input type="radio" name="attendance-type" value="IN" checked> အဝင် (In)</label>
                <label style="cursor:pointer; font-weight:600;"><input type="radio" name="attendance-type" value="OUT"> အထွက် (Out)</label>
            </div>
            <textarea id="remark" placeholder="မှတ်ချက် (ရှိလျှင် ထည့်ရန်)"></textarea>
            <button onclick="submitAttendance()" class="btn-green">Submit</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="script.js?v=2.0"></script>
</body>
</html>
