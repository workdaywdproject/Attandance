<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biometric Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <div class="container">
        <h2>📊 ဝန်ထမ်းတက်ရောက်မှုစနစ်</h2>
        <p class="sub-title">Biometric Auto-Recognition</p>
        <hr>

        <div id="step-1" class="card">
            <h3>🤖 ဇီဝအချက်အလက် စစ်ဆေးခြင်း</h3>
            <p id="instruction" class="instruction-box">စနစ်စတင်ရန် အောက်ပါခလုတ်ကို နှိပ်ပါ...</p>
            <button onclick="startAutoFaceScan()" class="btn-blue" id="btn-start-scan" style="margin-top: 12px;">📸 ကင်မရာဖွင့်၍ မျက်နှာစစ်ဆေးမည်</button>
            
            <div class="video-container hidden" id="webcam-box">
                <video id="video" autoplay muted playsinline></video>
            </div>
        </div>

        <div id="step-2" class="card hidden">
            <h3>📝 တက်ရောက်မှု တင်ပြခြင်း</h3>
            
            <div class="detail-box" style="background: rgba(16, 185, 129, 0.05); border-left-color: var(--success);">
                <p><b>ဝန်ထမ်းအမည်:</b> <span id="recognized-name" style="color: var(--success); font-weight:700; font-size:1.1rem;">-</span></p>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-top: 4px;">ဝန်ထမ်းကုဒ် (ID): <span id="recognized-id">-</span></p>
            </div>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>တက်ရောက်မှုအမျိုးအစား:</label>
                <div class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="attendance-type" value="IN" checked> 
                        <span>အဝင် (Check-In)</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="attendance-type" value="OUT"> 
                        <span>အထွက် (Check-Out)</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>မှတ်ချက် (Remark):</label>
                <input type="text" id="remark" placeholder="ဖြည့်သွင်းရန်ရှိက ရေးသားပါ">
            </div>

            <button onclick="showConfirmModal()" class="btn-green">📍 တက်ရောက်မှု တင်ပြမည်</button>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
            <a href="portal.html" class="nav-link">➔ ပင်မစာမျက်နှာ (Portal Gateway) သို့</a>
        </div>
    </div>

    <div id="confirm-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999;">
        <div class="card" style="width: 100%; max-width: 420px; margin: 16px; box-shadow: var(--shadow); border: 2px solid var(--success);">
            <h3 style="text-align: center; margin-bottom: 16px; color: var(--success);">🛒 တင်ပြမှု အတည်ပြုခြင်း</h3>
            <hr style="margin: 10px 0 20px 0;">
            
            <div class="detail-text" style="background: #f8fafc; padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px;">
                <p><b>ဝန်ထမ်း ID:</b> <span id="conf-id" style="font-weight: 600;"></span></p>
                <p><b>ဝန်ထမ်းအမည်:</b> <span id="conf-name" style="font-weight: 600; color: var(--primary);"></span></p>
                <p><b>အမျိုးအစား:</b> <span id="conf-type" style="font-weight: 600;"></span></p>
                <p><b>မှတ်ချက်:</b> <span id="conf-remark" style="font-style: italic; color: var(--text-muted);"></span></p>
            </div>

            <div class="button-row">
                <button onclick="submitAttendance()" class="btn-green">✓ အတည်ပြုသည်</button>
                <button onclick="closeConfirmModal()" class="btn-gray">ပြန်လည်ပြင်ဆင်မည်</button>
            </div>
        </div>
    </div>

    <div id="status-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="width: 100%; max-width: 380px; margin: 16px; box-shadow: var(--shadow); text-align: center; padding: 24px;">
            <div id="status-icon" style="font-size: 3rem; margin-bottom: 12px;"></div>
            <h3 id="status-title" style="margin-bottom: 8px;"></h3>
            <p id="status-message" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5;"></p>
            <button id="status-btn" onclick="closeStatusModal()" class="btn-blue" style="width: 50%; margin: 0 auto;">확인</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
