<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Employee Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h2>Admin Dashboard (ဝန်ထမ်းစီမံခန့်ခွဲမှု)</h2>
            <a href="dashboard.html" class="btn btn-purple">ပြက္ခဒိန်ကြည့်ရန်</a>
        </div>

        <div class="card">
            <h3 id="form-title">ဝန်ထမ်းအသစ် စာရင်းသွင်းရန်</h3>
            <div class="form-grid">
                <input type="text" id="admin-emp-id" placeholder="ဝန်ထမ်း ID (ဥပမာ - EMP001)" onchange="checkDuplicateID()">
                <input type="text" id="admin-emp-name" placeholder="ဝန်ထမ်း နာမည်">
                
                <div>
                    <button onclick="registerFaceScan()" class="btn-yellow" style="margin-bottom: 8px;">📸 Face Scan ဖတ်မည်</button>
                    <p id="face-status" style="font-size: 0.85rem; color: #ef4444; font-weight: 600; text-align: center;">Face Data: မရှိသေးပါ</p>
                </div>

                <input type="hidden" id="admin-face-data" value="">
            </div>

            <div id="admin-cam-box" class="hidden" style="margin-top: 16px; text-align: center;">
                <video id="admin-video" autoplay muted style="max-width: 320px; border: 3px solid #2563eb;"></video>
                <p style="color: #6b7280; font-size: 0.85rem; margin-top: 4px;">မျက်နှာကို ကင်မရာတည့်တည့် ထားပေးပါ (အစိမ်းရောင်အချက်ပြသည်အထိ စောင့်ပါ)...</p>
            </div>

            <button onclick="saveEmployee()" id="btn-save" class="btn-blue" style="margin-top: 16px;">စာရင်းသိမ်းမည်</button>
        </div>

        <div class="card">
            <h3>ဝန်ထမ်းများ စာရင်း</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ဝန်ထမ်း ID</th>
                            <th>နာမည်</th>
                            <th>Face Data Status</th>
                            <th>လုပ်ဆောင်ချက်</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.onload = function() { fetchEmployees(); };
    </script>
</body>
</html>
