<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="script.js"></script>
<body>

    <div class="admin-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0;">Admin Dashboard (ဝန်ထမ်းစီမံခြင်း)</h2>
            <a href="dashboard.html" class="btn-blue" style="width:auto; padding:10px 20px; text-decoration:none;">ပြက္ခဒိန်ကြည့်ရန်</a>
        </div>

        <div class="card">
            <h3 id="form-title" style="margin-bottom:16px;">ဝန်ထမ်းအသစ် စာရင်းသွင်းရန်</h3>
            <input type="text" id="admin-emp-id" placeholder="ဝန်ထမ်း ID (ဥပမာ - EMP001)" onchange="checkDuplicateID()">
            <input type="text" id="admin-emp-name" placeholder="ဝန်ထမ်း နာမည်">
            
            <button onclick="startFaceScan('ADMIN')" class="btn-yellow" style="margin-bottom:12px;">📸 မျက်နှာစကန်ဖတ်မည် (Liveness Check)</button>
            <p id="face-status" style="text-align:center; font-weight:600; color:#ef4444; margin-bottom:16px;">Face Data: မရှိသေးပါ</p>
            
            <input type="hidden" id="admin-face-data">
            <button onclick="saveEmployee()" id="btn-save" class="btn-blue">စာရင်းသိမ်းမည်</button>
        </div>

        <div id="admin-cam-box" class="hidden card" style="margin-top:16px;">
            <div id="admin-instruction" class="instruction-box">ခဏစောင့်ပါ... AI စနစ်ပြင်ဆင်နေပါသည်</div>
            <div class="camera-wrapper">
                <video id="admin-video" autoplay muted playsinline></video>
                <div class="camera-overlay"></div>
            </div>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3>ဝန်ထမ်းများ စာရင်း</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ဝန်ထမ်း ID</th>
                            <th>နာမည်</th>
                            <th>Face Status</th>
                            <th>လုပ်ဆောင်ချက်</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // စာမျက်နှာပွင့်လာသည်နှင့် Table အား ဆွဲတင်ခြင်း
        window.onload = function() { fetchEmployees(); };
    </script>
</body>
</html>
