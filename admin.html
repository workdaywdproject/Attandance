<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Employee Management</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <div class="container wide">
        <h2>⚙️ Admin Dashboard</h2>
        <p class="sub-title">ဝန်ထမ်းများ၏ ဇီဝအချက်အလက် စီမံခန့်ခွဲမှုစနစ်</p>
        <hr>

        <div class="admin-grid">
            <div class="card">
                <h3 id="form-title">ဝန်ထမ်းအသစ် ထည့်သွင်းရန်</h3>
                
                <div class="form-group">
                    <label>ဝန်ထမ်းကုဒ် (ID):</label>
                    <input type="text" id="admin-emp-id" onblur="checkDuplicateID()" placeholder="ဥပမာ - EMP001">
                </div>

                <div class="form-group">
                    <label>ဝန်ထမ်းအမည်:</label>
                    <input type="text" id="admin-emp-name" placeholder="ဥပမာ - ဦးမောင်မောင်">
                </div>

                <div class="form-group">
                    <label>မျက်နှာ ဇီဝအချက်အလက် (Biometric):</label>
                    <p id="face-status" style="color: #ef4444; font-weight: 600;">ဇီဝအချက်အလက် မရှိသေးပါ</p>
                    <button onclick="startFaceScan('ADMIN')" class="btn-blue">📸 မျက်နှာမှတ်တမ်းယူရန်</button>
                    <input type="hidden" id="admin-face-data">
                </div>

                <div id="admin-cam-box" class="hidden" style="margin-top: 15px;">
                    <p id="admin-instruction" class="instruction-box">ကင်မရာ ပြင်ဆင်နေပါသည်...</p>
                    <div class="video-container small">
                        <video id="admin-video" autoplay muted playsinline></video>
                    </div>
                </div>

                <div class="button-row" style="margin-top: 20px;">
                    <button id="btn-save" onclick="saveEmployee()" class="btn-green">💾 အချက်အလက် သိမ်းဆည်းမည်</button>
                    <button onclick="resetAdminForm()" class="btn-gray">ပြန်စမည်</button>
                </div>
            </div>

            <div class="card">
                <h3>👥 လက်ရှိဝန်ထမ်းစာရင်း</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ဝန်ထမ်းကုဒ်</th>
                                <th>အမည်</th>
                                <th>ဇီဝဒေတာ</th>
                                <th>လုပ်ဆောင်ချက်</th>
                            </tr>
                        </thead>
                        <tbody id="employee-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="nav-link">➔ ဝန်ထမ်း Attendance ပေးရန်စာမျက်နှာ</a> | 
            <a href="dashboard.html" class="nav-link">📊 Dashboard ကြည့်ရန်</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
