<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; background: #f1f5f9;">

    <div class="card" style="width: 100%; max-width: 440px; text-align: center; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <h2 style="color: var(--primary); margin-bottom: 6px;">HR Management System</h2>
        <p class="sub-title">Select an environment entry below to proceed</p>
        <hr style="margin: 20px 0;">

        <div style="display: flex; flex-direction: column; gap: 14px;">
            <button onclick="window.location.href='index.html'" class="btn-blue" style="padding: 15px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                🕒 Open Attendance Terminal
            </button>
            
            <button onclick="window.location.href='admin.html'" class="btn-green" style="padding: 15px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                🛠 Open Admin Control Panel
            </button>
        </div>

        <hr style="margin: 24px 0;">
        <p style="font-size: 0.75rem; color: var(--text-muted);">Secure Biometric Authentication Gate v2.4.0</p>
    </div>

</body>
</html>
