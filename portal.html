<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Gateway - Biometric Attendance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 480px;">
        <h2 style="text-align: center;">🏢 Biometric Attendance System</h2>
        <p class="sub-title" style="text-align: center;">ပင်မစာမျက်နှာ</p>
        <hr style="margin-bottom: 24px;">

        <div class="card" style="padding: 24px;">
            <button onclick="window.location.href='index.html'" class="btn-green" style="margin-bottom: 16px; padding: 16px; font-size: 1.1rem;">
                📊 ဝန်ထမ်းတက်ရောက်မှု မှတ်တမ်းတင်ရန်
            </button>
            
            <button onclick="openLoginModal()" class="btn-blue" style="padding: 14px; font-size: 1rem; background-color: var(--secondary);">
                ⚙️ စနစ်စီမံခန့်ခွဲသူအဖြစ် ဝင်ရောက်ရန် (Admin Dashboard)
            </button>
        </div>
    </div>

    <div id="login-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999;">
        <div class="card" style="width: 100%; max-width: 380px; margin: 16px; box-shadow: var(--shadow);">
            <h3 style="text-align: center; margin-bottom: 20px;">🔒 စနစ်စီမံခန့်ခွဲသူ ဝင်ရောက်ရန်</h3>
            
            <div class="form-group">
                <label>အသုံးပြုသူအမည် (Username):</label>
                <input type="text" id="login-user" placeholder="Username ရိုက်ထည့်ပါ">
            </div>
            
            <div class="form-group">
                <label>စကားဝှက် (Password):</label>
                <input type="password" id="login-pass" placeholder="Password ရိုက်ထည့်ပါ">
            </div>

            <div class="button-row" style="margin-top: 24px;">
                <button onclick="verifyAdminLogin()" class="btn-blue">ဝင်ရောက်မည်</button>
                <button onclick="closeLoginModal()" class="btn-gray">ပယ်ဖျက်မည်</button>
            </div>
        </div>
    </div>

    <div id="status-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="width: 100%; max-width: 380px; margin: 16px; box-shadow: var(--shadow); text-align: center; padding: 24px;">
            <div id="status-icon" style="font-size: 3rem; margin-bottom: 12px;"></div>
            <h3 id="status-title" style="margin-bottom: 8px;"></h3>
            <p id="status-message" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5;"></p>
            <button id="status-btn" onclick="closeStatusModal()" class="btn-blue" style="width: 60%; margin: 0 auto;">အိုကေ (OK)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
