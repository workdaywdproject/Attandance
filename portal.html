<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biometric Attendance Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }
        /* Portal Control Custom Button Style */
        .portal-admin-btn {
            background-color: #6c757d;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
        }
        .portal-admin-btn:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }
    </style>
</head>
<body>

    <div class="portal-container" style="margin: 0 auto; width: 100%;">
        <div class="card" style="position: relative; width: 100%; padding: 24px; text-align: center;">
            
            <div class="top-right-badge" style="margin-bottom: 24px; text-align: right;">
                <button onclick="showAdminLoginModal()" class="portal-admin-btn">
                    Admin Panel →
                </button>
            </div>

            <div style="margin-top: 10px;">
                <h3 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">ဝန်ထမ်းတက်ရောက်မှုစနစ်</h3>
                <p class="sub-title" style="margin-bottom: 30px;">Biometric Verification Hub</p>
            </div>

            <div style="margin-bottom: 10px;">
                <button onclick="window.location.href='index.html'" class="btn-blue" style="padding: 14px; font-size: 1rem; width: 100%;">
                    စနစ်စတင်အသုံးပြုမည်
                </button>
            </div>
        </div>
    </div>

    <div id="admin-login-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div class="card" style="width: 100%; max-width: 380px; margin: 16px; padding: 24px; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary);">Admin Authentication</h3>
                <button onclick="closeAdminLoginModal()" class="btn-gray" style="width: auto; padding: 4px 10px; font-size: 0.8rem; margin: 0; background: #e9ecef; color: #333;">ပိတ်မည်</button>
            </div>
            <hr>
            <div class="form-group">
                <label>အသုံးပြုသူအမည် (Username)</label>
                <input type="text" id="admin-username" placeholder="Username ရိုက်ထည့်ပါ">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>စကားဝှက် (Password)</label>
                <input type="password" id="admin-password" placeholder="Password ရိုက်ထည့်ပါ">
            </div>
            <button onclick="loginAdmin()" class="btn-blue"><span style="color:#fff;">လော့ဂ်အင်ဝင်မည်</span></button>
        </div>
    </div>

    <div id="status-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000;">
        <div class="card" style="width: 100%; max-width: 340px; margin: 16px; text-align: center; padding: 24px;">
            <h3 id="status-title" style="margin-bottom: 8px;"></h3>
            <p id="status-message" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4;"></p>
            <button onclick="closeStatusModal()" class="btn-blue" style="width: 50%; margin: 0 auto;">OK</button>
        </div>
    </div>

    <script>
        const API_URL = "https://recgyevngygrfozfjpqn.supabase.co"; 
        const API_KEY = "sb_publishable_M0rAOJuDodV286QzEiSe1w_6-nNdTq8";
        const appSupabase = supabase.createClient(API_URL, API_KEY);

        function showAdminLoginModal() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
        }

        function closeAdminLoginModal() {
            document.getElementById('admin-login-modal').classList.add('hidden');
            document.getElementById('admin-username').value = "";
            document.getElementById('admin-password').value = "";
        }

        function showStatus(title, message, isSuccess = false) {
            const modal = document.getElementById('status-modal');
            const titleEl = document.getElementById('status-title');
            titleEl.style.color = isSuccess ? "var(--success)" : "var(--danger)";
            titleEl.innerText = title;
            document.getElementById('status-message').innerText = message;
            modal.classList.remove('hidden');
        }

        function closeStatusModal() {
            document.getElementById('status-modal').classList.add('hidden');
        }

        async function loginAdmin() {
            const user = document.getElementById('admin-username').value.trim();
            const pass = document.getElementById('admin-password').value.trim();

            if (!user || !pass) {
                showStatus('သတိပေးချက်', 'အချက်အလက်များ ပြည့်စုံစွာ ဖြည့်သွင်းပါ။');
                return;
            }

            const { data, error } = await appSupabase
                .from('admin_settings')
                .select('*')
                .eq('username', user)
                .eq('password', pass);

            if (error || !data || data.length === 0) {
                showStatus('မအောင်မြင်ပါ', 'အသုံးပြုသူအမည် သို့မဟုတ် စကားဝှက် မှားယွင်းနေပါသည်။');
            } else {
                sessionStorage.setItem('admin_authenticated', 'true');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
