<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Gateway - Biometric Attendance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 500px; margin-top: 40px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2>ပင်မလုပ်ငန်းခွင် ဝင်ပေါက်</h2>
            <p class="sub-title">Portal Gateway Management System</p>
        </div>
        
        <div class="card" style="padding: 24px;">
            <div style="margin-bottom: 16px;">
                <button onclick="window.location.href='index.html'" class="btn-blue" style="padding: 12px; font-size: 1rem; display: flex; align-items: center; justify-content: center;">
                    ဝန်ထမ်းတက်ရောက်မှု စကင်ဖတ်ရန်
                </button>
            </div>
            
            <hr style="margin: 20px 0;">

            <div>
                <button onclick="openLoginModal()" class="btn-gray" style="padding: 12px; font-size: 1rem; display: flex; align-items: center; justify-content: center; background: #e2e8f0;">
                    စနစ်စီမံခန့်ခွဲသူ ဝင်ရောက်ရန် (Admin)
                </button>
            </div>
        </div>

        <p style="text-align: center; color: var(--text-muted); font-size: 0.75rem; white-space: nowrap;">© 2026 Biometric Attendance System. All Rights Reserved.</p>
    </div>

    <div id="login-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999;">
        <div class="card" style="width: 100%; max-width: 400px; margin: 12px; box-shadow: var(--shadow);">
            <h3 style="text-align: center; margin-bottom: 12px; color: var(--primary); white-space: nowrap;">စီမံခန့်ခွဲသူ လော့ဂ်အင်</h3>
            <hr style="margin: 8px 0 16px 0;">

            <div class="form-group">
                <label>အသုံးပြုသူအမည် (Username):</label>
                <input type="text" id="login-user" placeholder="username ရိုက်ထည့်ပါ">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>စကားဝှက် (Password):</label>
                <input type="password" id="login-pass" placeholder="password ရိုက်ထည့်ပါ">
            </div>

            <div class="button-row">
                <button onclick="verifyAdminLogin()" class="btn-blue">ဝင်ရောက်မည်</button>
                <button onclick="closeLoginModal()" class="btn-gray">ပယ်ဖျက်မည်</button>
            </div>
        </div>
    </div>

    <div id="status-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="width: 100%; max-width: 380px; margin: 12px; box-shadow: var(--shadow); text-align: center; padding: 20px;">
            <h3 id="status-title" style="margin-bottom: 6px; white-space: nowrap;"></h3>
            <p id="status-message" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4; white-space: nowrap;"></p>
            <button id="status-btn" onclick="closeStatusModal()" class="btn-blue" style="width: 50%; margin: 0 auto;">OK</button>
        </div>
    </div>

    <script>
        const API_URL = "https://recgyevngygrfozfjpqn.supabase.co"; 
        const API_KEY = "sb_publishable_M0rAOJuDodV286QzEiSe1w_6-nNdTq8";
        let appSupabase = (typeof supabase !== 'undefined') ? supabase.createClient(API_URL, API_KEY) : null;

        let postStatusAction = null;

        function showStatus(type, title, message, callback = null) {
            const modal = document.getElementById('status-modal');
            const titleEl = document.getElementById('status-title');
            const msgEl = document.getElementById('status-message');
            const btnEl = document.getElementById('status-btn');

            if (!modal) return;

            if (type === 'success') {
                titleEl.style.color = "var(--success)";
                btnEl.className = "btn-green";
            } else {
                titleEl.style.color = "var(--danger)";
                btnEl.className = "btn-red";
            }

            titleEl.innerText = title;
            msgEl.innerText = message;
            postStatusAction = callback;
            modal.classList.remove('hidden');
        }

        function closeStatusModal() {
            const modal = document.getElementById('status-modal');
            if (modal) modal.classList.add('hidden');
            if (postStatusAction) {
                postStatusAction();
                postStatusAction = null;
            }
        }

        function openLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeLoginModal();
                closeStatusModal();
            }
        });

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-user').value = "";
            document.getElementById('login-pass').value = "";
        }

        async function verifyAdminLogin() {
            const userInp = document.getElementById('login-user').value.trim();
            const passInp = document.getElementById('login-pass').value.trim();

            if(!userInp || !passInp) { 
                showStatus('error', 'သတိပေးချက်', 'အသုံးပြုသူအမည်နှင့် စကားဝှက် ဖြည့်သွင်းပါ။'); 
                return; 
            }
            if(!appSupabase) return;

            const { data, error } = await appSupabase
                .from('admin_settings')
                .select('*')
                .eq('username', userInp)
                .eq('password', passInp);

            if (error) {
                showStatus('error', 'စနစ်ချို့ယွင်းမှု', error.message);
                return;
            }

            if(data && data.length > 0) {
                sessionStorage.setItem('admin_authenticated', 'true');
                closeLoginModal();
                showStatus('success', 'အောင်မြင်ပါသည်', 'စစ်ဆေးမှု အောင်မြင်ပါသည်။', () => {
                    window.location.href = 'dashboard.html';
                });
            } else {
                showStatus('error', 'ငြင်းပယ်ပါသည်', 'အချက်အလက် မှားယွင်းနေပါသည်။');
            }
        }
    </script>
</body>
</html>
