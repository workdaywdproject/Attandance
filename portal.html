<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biometric Attendance Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
            background-color: var(--background);
        }
        .portal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 32px 24px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 100%;
        }
        .portal-admin-btn {
            background-color: #6c757d;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: block;
            margin-top: 12px;
        }
        .portal-admin-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="portal-card">
            
            <div style="margin-bottom: 28px;">
                <h3 style="font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 8px;">ဝန်ထမ်းတက်ရောက်မှုစနစ်</h3>
                <p class="sub-title" style="color: var(--text-muted); font-size: 0.85rem;">Biometric Verification Hub</p>
            </div>

            <div>
                <button onclick="window.location.href='index.html'" class="btn-blue" style="padding: 14px; font-size: 1rem; width: 100%; font-weight: 600;">
                    စနစ်စတင်အသုံးပြုမည်
                </button>
            </div>

            <button onclick="window.location.href='admin.html'" class="portal-admin-btn">
                Admin Panel
            </button>

        </div>
    </div>

</body>
</html>
