<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard - Calendar View</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <div class="admin-header">
            <h2>Attendance Dashboard (ပြက္ခဒိန် ဇယား)</h2>
            <div style="display: flex; gap: 8px;">
                <a href="index.html" class="btn btn-green" style="width: auto; padding: 10px 20px;">Scan ဖတ်ရန်</a>
                <a href="admin.html" class="btn btn-blue" style="width: auto; padding: 10px 20px;">Admin Page သို့</a>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div id="calendar"></div>
            </div>

            <div class="card" style="display: flex; flex-direction: column;">
                <h3 id="selected-date-title" style="border-b: 1px solid #e5e7eb; padding-bottom: 8px;">ရက်စွဲမှတ်တမ်း</h3>
                <div id="attendance-details" class="detail-text" style="flex: 1; color: #6b7280;">
                    <p style="font-style: italic;">ပြက္ခဒိန်ပေါ်ရှိ ဝန်ထမ်းမှတ်တမ်းတစ်ခုခုကို ထောက်ကြည့်လျှင် ထိုနေ့၏ အဝင်/အထွက် အချက်အလက်များကို ဤနေရာတွင် ပြပေးပါမည်။</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() { initCalendar(); });
    </script>
</body>
</html>
