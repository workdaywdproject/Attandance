<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <script>
        if(sessionStorage.getItem('admin_authenticated') !== 'true') {
            window.location.replace('portal.html');
        }
    </script>
</head>
<body>

    <div class="container wide">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h2>📊 Attendance Dashboard</h2>
            <button onclick="handleLogout()" class="btn-red" style="width: auto; padding: 8px 16px; font-size: 0.85rem;">🔒 Logout ထွက်မည်</button>
        </div>
        <p class="sub-title">ဝန်ထမ်းများ၏ နေ့စဉ် ရောက်ရှိမှု မှတ်တမ်းပြက္ခဒိန်</p>
        <hr>

        <div class="admin-grid">
            <div class="card">
                <div id="calendar"></div>
            </div>

            <div class="card">
                <h3 id="selected-date-title">မှတ်တမ်းအသေးစိတ်</h3>
                <div id="attendance-details">
                    <p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.95rem;">
                        အသေးစိတ် အချက်အလက်များကို ကြည့်ရှုရန် ပြက္ခဒိန်ပေါ်ရှိ မှတ်တမ်းတစ်ခုခုကို နှိပ်ပါ။
                    </p>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
            <a href="portal.html" class="nav-link">🚪 Portal Main Gateway</a>  •  
            <a href="admin.html" class="nav-link">⚙️ Admin Control သို့ သွားရန်</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
